name: Reference implementations

on:
  push:
    paths: ["reference/**", ".github/workflows/reference.yml"]
  pull_request:
    paths: ["reference/**", ".github/workflows/reference.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: reference
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: reference/package-lock.json
      - uses: aiken-lang/setup-aiken@6c34dba56aaf48922bdb18943d5de25608297650 # v1
        with:
          version: v1.1.22
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build plugin workspace packages
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target wasm32-wasip2
          RUSTUP_TOOLCHAIN=1.95.0 npm run build:plugins
      - name: Typecheck, formatting, lint, coverage, onchain properties, and signed integration
        run: npm run check
      - name: Check pinned Kupo database reuse policy
        run: |
          docker pull cardanosolutions/kupo@sha256:7d3c62368a4a5a609f5cf0ee6949eb8d491ed8f5a4d05b38da3213d95735f03b
          npx vitest run --project node services/indexer/kupo/test/node --reporter=default
      - name: Preserve coverage and execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reference-validation
          path: reference/artifacts/
          retention-days: 14

  plugins:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: reference
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: reference/package-lock.json
      - name: Install component target and workspace dependencies
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target wasm32-wasip2
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Check loader, discovery and collection planning
        run: npm run test:plugins
      - name: Check component execution through JCO and Wasmtime
        run: npm test --workspace @ctvs/example-plugin
      - name: Check isolated packed consumers
        run: npm run test:plugins:package
