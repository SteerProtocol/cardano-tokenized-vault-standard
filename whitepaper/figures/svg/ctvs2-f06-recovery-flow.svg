  <g id="labels">
    <text fill="#52687C" font-family="Liberation Sans" font-size="20" font-weight="600" letter-spacing="1.5" text-anchor="middle" x="740" y="40">CTVS-2  /  DIRECT CUSTODY PROFILE • FIXED FULL-VALUE REFUND</text>
    <text fill="#122C45" font-family="Liberation Serif" font-size="45" font-weight="700" text-anchor="middle" x="740" y="101">Recovery can succeed when settlement cannot</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="29" font-weight="700" text-anchor="start" x="132" y="273.0">Actual Request</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="29" font-weight="700" text-anchor="start" x="132" y="305.48">value</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="27" font-weight="400" text-anchor="start" x="76" y="345.48">101,000 UNIT</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="27" font-weight="400" text-anchor="start" x="76" y="382.20000000000005">3,500,000 lovelace</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="27" font-weight="400" text-anchor="start" x="76" y="418.92">7 EXTRA</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="29" font-weight="700" text-anchor="start" x="628" y="273.0">Decode Recovery</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="29" font-weight="700" text-anchor="start" x="628" y="305.48">first</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="572" y="345.48">Supported outer version</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="572" y="379.48">Vault, controller, fixed refund</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="572" y="413.48">Deadline</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="29" font-weight="700" text-anchor="start" x="1124" y="273.0">Invalid economics</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="1068" y="313.0">Unsupported C(99, [])</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="1068" y="345.64">Settlement must reject.</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="1068" y="378.28">This does not alone block</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="1068" y="410.92">refund.</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="29" font-weight="700" text-anchor="start" x="132" y="635.0">External fee funding</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="76" y="675.0">Pays the network fee and any</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="76" y="707.64">required output top-up.</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="76" y="740.28">No request asset is retained.</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="28" font-weight="700" text-anchor="start" x="628" y="635.0">Controller OR expiry</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="572" y="675.0">Controller key may cancel.</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="572" y="707.64">Anyone may refund when the</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="572" y="740.28">whole interval is at/after expiry.</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="29" font-weight="700" text-anchor="start" x="1124" y="635.0">Fixed full-value</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="29" font-weight="700" text-anchor="start" x="1124" y="667.48">refund</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="1068" y="707.48">101,000 UNIT • 7 EXTRA</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="1068" y="740.12">3,500,000 lovelace</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="1068" y="772.76">Exact destination and datum</text>
    <text fill="#345E86" font-family="Liberation Sans" font-size="21" font-weight="600" text-anchor="middle" x="846" y="543">refund branch</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="27" font-weight="700" text-anchor="start" x="122" y="884">No current State, NAV, open pause flag or batcher is required.</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="23" font-weight="400" text-anchor="start" x="76" y="925.0">Unknown outer versions, malformed Recovery or invalid destinations have no universal rescue promise. Full-value preservation is</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="23" font-weight="400" text-anchor="start" x="76" y="955.82">not unconditional liveness.</text>
