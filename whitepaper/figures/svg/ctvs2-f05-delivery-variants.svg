  <g id="labels">
    <text fill="#52687C" font-family="Liberation Sans" font-size="20" font-weight="600" letter-spacing="1.5" text-anchor="middle" x="740" y="40">CTVS-2  /  DIRECT CUSTODY PROFILE AND A SEPARATE NATIVE SEMANTIC VARIANT</text>
    <text fill="#122C45" font-family="Liberation Serif" font-size="45" font-weight="700" text-anchor="middle" x="740" y="101">Two delivery paths, one economic cutover</text>
    <text fill="#345E86" font-family="Liberation Sans" font-size="26" font-weight="700" text-anchor="start" x="76" y="215">A  Direct Custody Profile  -  FUNDED CLAIM</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="28" font-weight="700" text-anchor="start" x="160" y="292.0">Request</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="104" y="332.0">Direct Custody Profile</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="104" y="364.64">Consent consumed in</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="104" y="397.28">settlement</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="29" font-weight="700" text-anchor="start" x="626" y="292.0">Funded claim</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="570" y="332.0">100,000 SHARE + 2,000,000</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="570" y="364.64">lovelace</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="570" y="397.28">Shares already participate</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="28" font-weight="700" text-anchor="start" x="1164" y="292.0">Final receiver</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="1108" y="332.0">Exact destination and</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="1108" y="364.64">datum</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="1108" y="397.28">No repricing or mint</text>
    <text fill="#345E86" font-family="Liberation Sans" font-size="21" font-weight="600" text-anchor="middle" x="471" y="312">settle</text>
    <text fill="#32765B" font-family="Liberation Sans" font-size="21" font-weight="600" text-anchor="middle" x="1009" y="312">deliver later</text>
    <text fill="#947331" font-family="Liberation Sans" font-size="26" font-weight="700" text-anchor="start" x="76" y="543">B  NATIVE SEMANTIC VARIANT  -  DIRECT AT SETTLEMENT</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="28" font-weight="700" text-anchor="start" x="160" y="620.0">Request</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="104" y="660.0">Explicit direct-delivery</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="104" y="692.64">consent and variant</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="104" y="725.28">binding</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="29" font-weight="700" text-anchor="start" x="626" y="620.0">Settlement</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="570" y="660.0">Same quote, fees and supply</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="570" y="692.64">change</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="570" y="725.28">No intermediate Claim UTxO</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="28" font-weight="700" text-anchor="start" x="1164" y="620.0">Final receiver</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="1108" y="660.0">100,000 SHARE</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="1108" y="692.64">2,000,000 lovelace</text>
    <text fill="#947331" font-family="Liberation Sans" font-size="21" font-weight="600" text-anchor="middle" x="471" y="640">consume</text>
    <text fill="#947331" font-family="Liberation Sans" font-size="21" font-weight="600" text-anchor="middle" x="1009" y="640">pay now</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="27" font-weight="700" text-anchor="start" x="122" y="877">A native variant cannot reinterpret an existing Direct Custody Profile request.</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="23" font-weight="400" text-anchor="start" x="76" y="918.0">It needs its own reviewed consent, encoding and transaction rules. Both routes change economic participation at settlement - not</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="23" font-weight="400" text-anchor="start" x="76" y="948.82">at later claim delivery.</text>
  </g>
