  <g id="labels">
    <text fill="#52687C" font-family="Liberation Sans" font-size="20" font-weight="600" letter-spacing="1.5" text-anchor="middle" x="740" y="40">CTVS-1  /  DIRECT CUSTODY PROFILE</text>
    <text fill="#122C45" font-family="Liberation Serif" font-size="45" font-weight="700" text-anchor="middle" x="740" y="101">Acyclic genesis &amp; identity creation</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="21" font-weight="600" letter-spacing="1" text-anchor="start" x="48" y="176">INPUTS</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="21" font-weight="600" letter-spacing="1" text-anchor="start" x="535" y="176">BUILD</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="21" font-weight="600" letter-spacing="1" text-anchor="start" x="1040" y="176">ONE-TIME TRANSACTION</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="28" font-weight="700" text-anchor="start" x="132" y="252.0">Seed output r0</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="76" y="292.0">Existing UTxO</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="76" y="324.64">Consumed once at genesis</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="28" font-weight="700" text-anchor="start" x="132" y="452.0">Terms K</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="76" y="492.0">Assets, fees, modes, roles</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="76" y="524.64">Commitment hK</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="76" y="557.28">No self-dependent hash</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="28" font-weight="700" text-anchor="start" x="619" y="317.0">Parameterize T</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="563" y="357.0">Compile F_lock and Q_claim</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="563" y="389.64">first.</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="563" y="422.28">Apply r0 and hK to T.</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="563" y="454.92">Derive policy / script hash P.</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="29" font-weight="700" text-anchor="start" x="1124" y="252.0">Genesis mint</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="1068" y="292.0">Consume r0.</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="1068" y="324.64">Mint ID(1) and STATE(1).</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="1068" y="357.28">Mint no SHARE.</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="1068" y="389.92">Reject extra policy assets.</text>
    <text fill="#725294" font-family="Liberation Sans" font-size="21" font-weight="600" text-anchor="middle" x="470" y="260">r0</text>
    <text fill="#345E86" font-family="Liberation Sans" font-size="21" font-weight="600" text-anchor="middle" x="475" y="551">hK</text>
    <text fill="#526A7E" font-family="Liberation Sans" font-size="21" font-weight="600" text-anchor="middle" x="978" y="328">P</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="30" font-weight="700" text-anchor="start" x="132" y="727.0">Config at F_lock</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="76" y="767.0">ID(1) • Terms K and hK • exact reserve</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="30" font-weight="700" text-anchor="start" x="856" y="727.0">State at P</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="800" y="767.0">STATE(1) • A = S = F = 0 • positive reserve</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="middle" x="740" y="921.0">After genesis: only SHARE may change, coupled to an authentic State transition.</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="middle" x="740" y="953.16">ID and STATE cannot be minted again or burned. Compiled deployment proof remains required.</text>
