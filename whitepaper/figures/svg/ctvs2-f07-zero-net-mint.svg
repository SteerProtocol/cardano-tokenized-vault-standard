  <g id="labels">
    <text fill="#52687C" font-family="Liberation Sans" font-size="20" font-weight="600" letter-spacing="1.5" text-anchor="middle" x="740" y="40">CTVS-2  /  ONE-TO-ONE SNAPSHOT • ZERO FEES</text>
    <text fill="#122C45" font-family="Liberation Serif" font-size="45" font-weight="700" text-anchor="middle" x="740" y="101">Zero net mint does not mean zero obligations</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="21" font-weight="600" letter-spacing="0.5" text-anchor="start" x="48" y="181">CONSUMED REQUESTS</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="21" font-weight="600" letter-spacing="0.5" text-anchor="start" x="544" y="181">GROSS ECONOMIC EFFECTS</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="21" font-weight="600" letter-spacing="0.5" text-anchor="start" x="1040" y="181">FUNDED RESULTS</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="30" font-weight="700" text-anchor="start" x="132" y="275.0">Deposit request</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="28" font-weight="400" text-anchor="start" x="76" y="315.0">10 UNIT</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="30" font-weight="700" text-anchor="start" x="628" y="275.0">Issue +10 SHARE</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="572" y="315.0">Backing +10 UNIT</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="572" y="347.64">Participating shares +10</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="29" font-weight="700" text-anchor="start" x="1124" y="275.0">Depositor claim</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="1068" y="315.0">10 SHARE</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="1068" y="349.0">Already participating</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="28" font-weight="700" text-anchor="start" x="132" y="520.0">Redemption request</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="26" font-weight="400" text-anchor="start" x="76" y="560.0">10 pre-existing SHARE</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="27" font-weight="700" text-anchor="start" x="628" y="520.0">Extinguish 10 SHARE</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="572" y="560.0">Backing −10 UNIT</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="572" y="592.64">Participating shares −10</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="29" font-weight="700" text-anchor="start" x="1124" y="520.0">Redeemer claim</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="1068" y="560.0">10 UNIT</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="1068" y="594.0">Fixed allocated assets</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="37" font-weight="700" text-anchor="middle" x="740" y="732">10 issued − 10 extinguished = 0 net SHARE mint</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="middle" x="740" y="782">A = S = 1,000 before and after. Both economic exchanges still occur.</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="middle" x="740" y="844.0">State and Request handlers must enforce both gross effects, exact claims and value conservation,</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="middle" x="740" y="876.16">even when no minting-policy invocation occurs for SHARE.</text>
