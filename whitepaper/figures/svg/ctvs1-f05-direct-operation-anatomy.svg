  <g id="labels">
    <text fill="#52687C" font-family="Liberation Sans" font-size="20" font-weight="600" letter-spacing="1.5" text-anchor="middle" x="740" y="40">CTVS-1  /  WORKED EXAMPLES 1 AND 2</text>
    <text fill="#122C45" font-family="Liberation Serif" font-size="45" font-weight="700" text-anchor="middle" x="740" y="101">Deposit and redeem: opposite supply effects</text>
    <text fill="#345E86" font-family="Liberation Sans" font-size="26" font-weight="700" text-anchor="start" x="76" y="212">1  DEPOSIT 101,000 UNIT</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="22" font-weight="400" text-anchor="start" x="76" y="246">Fee-exclusive admission; then share issuance</text>
    <text fill="#725294" font-family="Liberation Sans" font-size="26" font-weight="700" text-anchor="start" x="800" y="212">2  REDEEM 50,500 SHARE</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="22" font-weight="400" text-anchor="start" x="800" y="246">Uses the deposit’s successor state</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="30" font-weight="700" text-anchor="start" x="160" y="322.0">Consumed inputs</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="104" y="362.0">State: A = S = 1,000,000; F = 0</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="104" y="394.64">User: 101,000 UNIT + 6,000,000 lovelace</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="30" font-weight="700" text-anchor="start" x="884" y="322.0">Consumed inputs</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="828" y="362.0">State: A = S = 1,100,000; F = 1,000</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="828" y="394.64">Holder: 50,500 SHARE + 5,000,000 lovelace</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="30" font-weight="700" text-anchor="start" x="160" y="546.0">Recompute &amp; enforce bounds</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="104" y="586.0">Entry fee: 1,000 UNIT</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="104" y="618.64">Backing +100,000; issue 100,000 SHARE</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="104" y="651.28">Minimum: 99,900 SHARE</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="30" font-weight="700" text-anchor="start" x="884" y="546.0">Recompute &amp; enforce bounds</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="828" y="586.0">Gross debit: 50,500; exit fee: 500 UNIT</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="828" y="618.64">Pay 50,000 UNIT; extinguish 50,500 SHARE</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="828" y="651.28">Minimum: 49,900 UNIT</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="30" font-weight="700" text-anchor="start" x="160" y="802.0">Created outputs</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="104" y="842.0">State: 1,101,000 UNIT</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="104" y="874.64">Receiver: 100,000 SHARE</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="30" font-weight="700" text-anchor="start" x="884" y="802.0">Created outputs</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="828" y="842.0">State: 1,051,000 UNIT</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="828" y="874.64">Receiver: 50,000 UNIT</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="27" font-weight="700" text-anchor="start" x="122" y="1016">Fees remain separate from share backing.</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="23" font-weight="400" text-anchor="start" x="76" y="1057.0">UNIT and SHARE amounts are base units. State reserves, output ADA, funder change and network fees remain separately</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="23" font-weight="400" text-anchor="start" x="76" y="1087.82">accounted for in Section 9.</text>
