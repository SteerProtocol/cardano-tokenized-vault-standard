  <g id="labels">
    <text fill="#52687C" font-family="Liberation Sans" font-size="20" font-weight="600" letter-spacing="1.5" text-anchor="middle" x="740" y="40">CTVS-2  /  MANAGED EXTENSION BOUNDARY • NOT A DIRECT CUSTODY PROFILE WORKFLOW</text>
    <text fill="#122C45" font-family="Liberation Serif" font-size="45" font-weight="700" text-anchor="middle" x="740" y="101">Committed downstream is no longer pending escrow</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="29" font-weight="700" text-anchor="start" x="132" y="283.0">Pending escrow</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="76" y="323.0">Property remains at request</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="76" y="357.0">guard.</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="76" y="391.0">Fixed cancellation / expiry</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="76" y="425.0">rights.</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="76" y="459.0">Not share backing.</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="29" font-weight="700" text-anchor="start" x="628" y="283.0">Accepted / in-flight</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="572" y="323.0">Assets committed</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="572" y="357.0">downstream.</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="572" y="391.0">Exposure and failure rights</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="572" y="425.0">change.</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="572" y="459.0">Not automatically refundable.</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="29" font-weight="700" text-anchor="start" x="1124" y="283.0">Funded result</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="1068" y="323.0">Shares issued or assets fixed.</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="1068" y="357.0">Economic cutover is explicit.</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="1068" y="391.0">Delivery rights are defined.</text>
    <text fill="#947331" font-family="Liberation Sans" font-size="21" font-weight="600" text-anchor="middle" x="493" y="348">accept</text>
    <text fill="#32765B" font-family="Liberation Sans" font-size="21" font-weight="600" text-anchor="middle" x="989" y="348">settle</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="29" font-weight="700" text-anchor="start" x="132" y="679.0">Fixed refund</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="76" y="719.0">Only while property remains</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="76" y="751.64">PendingEscrow under the</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="76" y="784.28">declared profile.</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="29" font-weight="700" text-anchor="start" x="628" y="679.0">Failure / unwind</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="572" y="719.0">Who bears the loss?</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="572" y="751.64">What can be cancelled?</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="572" y="784.28">Which on-chain right recovers</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="572" y="816.92">value?</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="27" font-weight="700" text-anchor="start" x="1124" y="679.0">Required extension</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="27" font-weight="700" text-anchor="start" x="1124" y="709.24">rules</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="1068" y="749.24">Custody and valuation</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="1068" y="781.88">Interim ownership and losses</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="1068" y="814.52">Actual recovery permissions</text>
    <text fill="#345E86" font-family="Liberation Sans" font-size="21" font-weight="600" text-anchor="middle" x="360" y="581">cancel / expire</text>
    <text fill="#A15564" font-family="Liberation Sans" font-size="21" font-weight="600" text-anchor="middle" x="808" y="581">failure</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="middle" x="740" y="894.0">An operator notice or timeout cannot reverse a completed investment or manufacture liquidity.</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="middle" x="740" y="927.5">The extension must specify the rights at every intermediate state.</text>
