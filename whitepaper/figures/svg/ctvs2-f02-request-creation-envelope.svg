  <g id="labels">
    <text fill="#52687C" font-family="Liberation Sans" font-size="20" font-weight="600" letter-spacing="1.5" text-anchor="middle" x="740" y="40">CTVS-2  /  DIRECT CUSTODY PROFILE • INDEPENDENT REQUEST CREATION</text>
    <text fill="#122C45" font-family="Liberation Serif" font-size="45" font-weight="700" text-anchor="middle" x="740" y="101">One request, two deliberately separate validation paths</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="29" font-weight="700" text-anchor="start" x="132" y="247.0">User inputs</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="76" y="287.0">Offered assets or shares</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="76" y="319.64">Storage + execution budget</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="29" font-weight="700" text-anchor="start" x="628" y="247.0">Create request</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="572" y="287.0">Create an independent UTxO.</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="572" y="319.64">Return user change.</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="29" font-weight="700" text-anchor="start" x="1124" y="247.0">Request UTxO</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="1068" y="287.0">Stable identity: originating</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="1068" y="319.64">transaction output reference</text>
    <text fill="#32765B" font-family="Liberation Sans" font-size="20" font-weight="600" text-anchor="middle" x="322.0" y="449">ACCOUNTING STATE IS NOT CONSUMED</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="600" text-anchor="middle" x="740" y="492">SUPPORTED OUTER VERSION  +  RECOVERY  +  ECONOMIC BODY</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="30" font-weight="700" text-anchor="start" x="132" y="582.0">Stable Recovery envelope</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="76" y="622.0">Vault binding and controller</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="76" y="656.0">Fixed refund destination and datum</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="76" y="690.0">Deadline</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="76" y="724.0">Read before economic downcasting</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="30" font-weight="700" text-anchor="start" x="856" y="582.0">Settlement-only economic body</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="800" y="622.0">Terms, operation and offered quantity</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="800" y="656.0">Minimum output and success receiver</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="800" y="690.0">Storage, budget and exact settler fee</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="800" y="724.0">Validate the complete economic intent</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="middle" x="740" y="911.0">Creation does not change backing or supply, reserve capacity, or prove settlement eligibility.</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="middle" x="740" y="943.16">Unsupported economics can remain refundable only when the outer Recovery envelope is valid.</text>
