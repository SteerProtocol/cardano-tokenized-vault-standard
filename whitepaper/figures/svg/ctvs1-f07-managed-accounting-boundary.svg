  <g id="labels">
    <text fill="#52687C" font-family="Liberation Sans" font-size="20" font-weight="600" letter-spacing="1.5" text-anchor="middle" x="740" y="40">CTVS-1  /  MANAGED EXTENSION • OUTSIDE DIRECT CUSTODY PROFILE</text>
    <text fill="#122C45" font-family="Liberation Serif" font-size="45" font-weight="700" text-anchor="middle" x="740" y="101">Managed backing is not the same as available liquidity</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="29" font-weight="700" text-anchor="start" x="132" y="287.0">Custody evidence</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="26" font-weight="400" text-anchor="start" x="76" y="327.0">Idle underlying</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="26" font-weight="400" text-anchor="start" x="76" y="362.36">Authenticated positions</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="26" font-weight="400" text-anchor="start" x="76" y="397.72">Restricted assets</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="26" font-weight="400" text-anchor="start" x="76" y="433.08">Actual downstream rights</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="29" font-weight="700" text-anchor="start" x="628" y="287.0">Valuation &amp;</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="29" font-weight="700" text-anchor="start" x="628" y="319.48">liabilities</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="572" y="359.48">Pinned position set</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="572" y="393.48">Debt and accrued fees</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="572" y="427.48">Accepted state-basis report</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="25" font-weight="400" text-anchor="start" x="572" y="461.48">Reporter trust disclosed</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="29" font-weight="700" text-anchor="start" x="1124" y="243.0">Backing A</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="1068" y="283.0">Recognized net equity</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="1068" y="315.64">No double counting</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="1068" y="348.28">Deficits remain explicit</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="29" font-weight="700" text-anchor="start" x="1124" y="515.0">Liquidity L</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="1068" y="555.0">What can actually be paid</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="1068" y="587.64">Available underlying</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="1068" y="620.28">Authorized unwind path</text>
    <text fill="#122C45" font-family="Liberation Sans" font-size="28" font-weight="700" text-anchor="start" x="132" y="762.0">Bind absolute NAV to its exact accounting-state basis</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="76" y="802.0">Otherwise use only a separately specified and proved cash-flow bridge; a stale absolute report cannot silently overwrite</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="start" x="76" y="834.64">intervening flows.</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="middle" x="740" y="903.0">A signature identifies the reporter - it does not establish truthful value.</text>
    <text fill="#52687C" font-family="Liberation Sans" font-size="24" font-weight="400" text-anchor="middle" x="740" y="935.16">Positive backing does not guarantee immediate exit. Managed conformance still needs a real integration.</text>
