  <rect fill="white" height="940" width="1480" x="0" y="0"/>
  <g id="background-panels"/>
  <g id="connectors">
    <path d="M 604 341 L 876 341" fill="none" marker-end="url(#arrow-purple)" stroke="#725294" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"/>
    <path d="M 876 478 L 604 478" fill="none" marker-end="url(#arrow-blue)" stroke="#345E86" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"/>
  </g>
  <g id="cards">
    <rect fill="#EDF1F5" height="334" opacity="0.35" rx="18" width="556" x="48" y="241"/>
    <rect fill="url(#fill-purple)" height="334" rx="18" stroke="#A18BBE" stroke-width="1.8" width="556" x="48" y="239"/>
    <g fill="none" stroke="#725294" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" transform="translate(73,255) scale(0.8333333333333334)">
      <path d="M 11 5 H 29 L 38 14 V 43 H 11 Z M 29 5 V 14 H 38 M 17 23 H 31 M 17 30 H 31 M 17 36 H 26"/>
    </g>
    <rect fill="#EDF1F5" height="334" opacity="0.35" rx="18" width="556" x="876" y="241"/>
    <rect fill="url(#fill-blue)" height="334" rx="18" stroke="#7D9FBE" stroke-width="1.8" width="556" x="876" y="239"/>
    <g fill="none" stroke="#345E86" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" transform="translate(901,255) scale(0.8333333333333334)">
      <ellipse cx="24" cy="10" rx="16" ry="6"/>
      <path d="M 8 10 V 35 C 8 44 40 44 40 35 V 10 M 8 23 C 8 32 40 32 40 23 M 8 34 C 8 43 40 43 40 34"/>
