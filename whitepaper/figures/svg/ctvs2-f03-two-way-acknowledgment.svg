    <rect fill="url(#fill-green)" height="168" rx="18" stroke="#78A88F" stroke-width="1.8" width="1384" x="48" y="631"/>
    <g fill="none" stroke="#32765B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" transform="translate(73,647) scale(0.8333333333333334)">
